<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>念瑞小栈</title>
<link rel="stylesheet" href="css/styles.css?v=9" />
</head>
<body>
<div class="app">
  <!-- 左侧固定侧边导航 -->
  <aside class="sidebar">
    <div class="brand">
      <button class="avatar-btn" id="avatarBtn" title="点击自定义头像">
        <img id="avatarImg" alt="头像" hidden />
        <span class="avatar-fallback" id="avatarFallback">函</span>
      </button>
      <div class="brand-text">
        <div class="brand-name" id="brandName">念瑞小栈</div>
        <div class="brand-sub">专属个人工作台</div>
      </div>
    </div>

    <nav class="nav" id="nav">
      <a class="nav-item active" data-page="home">
        <svg viewBox="0 0 24 24" class="ic"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
        <span>首页总览</span>
      </a>
      <a class="nav-item" data-page="plan">
        <svg viewBox="0 0 24 24" class="ic"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 9.5h17M8 3.5v3M16 3.5v3"/></svg>
        <span>日常规划</span>
      </a>
      <a class="nav-item" data-page="checkin">
        <svg viewBox="0 0 24 24" class="ic"><circle cx="12" cy="12" r="8.5"/><path d="M8 12.2l2.6 2.6L16.5 9"/></svg>
        <span>打卡记录</span>
      </a>
      <a class="nav-item" data-page="countdown">
        <svg viewBox="0 0 24 24" class="ic"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3.2 2M9 3.5h6M9 20.5h6"/></svg>
        <span>倒计时</span>
      </a>
      <a class="nav-item" data-page="note">
        <svg viewBox="0 0 24 24" class="ic"><path d="M9 4h7a3 3 0 0 1 3 3v10.5a2.5 2.5 0 0 1-2.5 2.5H9a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3Z"/><path d="M8 9.5h8M8 13h8M8 16.5h5"/></svg>
        <span>灵感速记</span>
      </a>
      <a class="nav-item" data-page="info-storage">
        <svg viewBox="0 0 24 24" class="ic"><path d="M22 19V8a2 2 0 0 0-2-2h-7l-2-3H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2Z"/><path d="M3 10h18"/></svg>
        <span>信息存储</span>
      </a>
      <a class="nav-item" data-page="stats">
        <svg viewBox="0 0 24 24" class="ic"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
        <span>个人数据统计看板</span>
      </a>
      <a class="nav-item" data-page="settings">
        <svg viewBox="0 0 24 24" class="ic"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.12-1.3l2-1.5-2-3.4-2.3 1a7 7 0 0 0-2.2-1.3L14 2h-4l-.4 2.4a7 7 0 0 0-2.2 1.3l-2.3-1-2 3.4 2 1.5A7 7 0 0 0 5 12c0 .44.04.88.12 1.3l-2 1.5 2 3.4 2.3-1c.66.56 1.4 1 2.2 1.3L10 22h4l.4-2.4c.8-.3 1.54-.74 2.2-1.3l2.3 1 2-3.4-2-1.5c.08-.42.12-.86.12-1.3Z"/></svg>
        <span>个性化设置</span>
      </a>
    </nav>

    <div class="sidebar-foot">温柔清爽 · 绿色系</div>
  </aside>

  <!-- 右侧主内容 -->
  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <h1 class="page-title" id="pageTitle">首页总览</h1>
        <div class="signature" id="signature">—— 今日份的温柔与努力 ——</div>
      </div>
      <div class="topbar-right" id="clockBar">
        <div class="clk-time" id="clkTime">--:--:--</div>
        <div class="clk-meta">
          <span id="clkDate">—</span> · <span id="clkLunar">农历 —</span> · <span id="clkWeather">🌿 —</span>
        </div>
      </div>
    </header>

    <div class="content" id="content">
      <!-- 首页总览 -->
      <section class="page active" id="page-home">
        <div class="home-grid" id="homeGrid"></div>
      </section>

      <!-- 日常规划 -->
      <section class="page" id="page-plan">
        <div class="toolbar">
          <div class="seg" id="viewSeg">
            <button class="seg-btn active" data-view="month">月</button>
            <button class="seg-btn" data-view="week">周</button>
            <button class="seg-btn" data-view="day">日</button>
          </div>
          <div class="toolbar-right">
            <button class="btn ghost" id="calPrev">‹</button>
            <span class="cal-range" id="calRange"></span>
            <button class="btn ghost" id="calNext">›</button>
            <button class="btn ghost" id="calToday">今天</button>
            <button class="btn" data-action="open-import">导入课表</button>
            <button class="btn primary" data-action="open-schedule">+ 新增行程</button>
          </div>
        </div>
        <div id="calendar" class="calendar"></div>
      </section>

      <!-- 打卡记录 -->
      <section class="page" id="page-checkin"></section>

      <!-- 倒计时 -->
      <section class="page" id="page-countdown">
        <div class="toolbar">
          <div class="seg" id="cdFilter">
            <button class="seg-btn active" data-cat="all">全部</button>
            <button class="seg-btn" data-cat="star">追星纪念</button>
            <button class="seg-btn" data-cat="exam">学习考试</button>
            <button class="seg-btn" data-cat="life">生活自律</button>
          </div>
          <div class="toolbar-right">
            <button class="btn primary" data-action="open-timer">+ 新建计时</button>
          </div>
        </div>
        <div id="cdList" class="cd-grid"></div>
      </section>

      <!-- 灵感速记 -->
      <section class="page" id="page-note">
        <div class="toolbar">
          <div class="seg" id="noteTabs">
            <button class="seg-btn active" data-folder="all">全部</button>
            <button class="seg-btn" data-folder="study">学习灵感</button>
            <button class="seg-btn" data-folder="daily">日常碎碎念</button>
            <button class="seg-btn" data-folder="fandom">饭圈素材</button>
          </div>
          <div class="toolbar-right">
            <input class="search" id="noteSearch" placeholder="全局关键词检索…" />
            <button class="btn primary" data-action="open-note">+ 速记</button>
          </div>
        </div>
        <div id="noteList" class="note-grid"></div>
      </section>

      <!-- 信息存储 -->
      <section class="page" id="page-info-storage">
        <div class="toolbar">
          <div class="seg" id="storageTabs"></div>
          <div class="toolbar-right">
            <button class="btn" data-action="open-group">+ 新建分组</button>
            <button class="btn primary" data-action="open-upload">上传文件</button>
          </div>
        </div>
        <div id="storageList" class="storage-grid"></div>
      </section>

      <!-- 数据统计看板 -->
      <section class="page" id="page-stats">
        <div id="statsContent"></div>
      </section>

      <!-- 个性化设置 -->
      <section class="page" id="page-settings">
        <div id="settingsContent"></div>
      </section>
    </div>
  </main>
</div>

<!-- 通用弹窗 -->
<div class="modal-mask" id="modalMask" hidden>
  <div class="modal" id="modal">
    <div class="modal-head">
      <h3 id="modalTitle"></h3>
      <button class="modal-close" id="modalClose">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<!-- 图片查看 -->
<div class="modal-mask" id="imgMask" hidden>
  <div class="img-card" style="position:relative;background:var(--card);padding:12px;border-radius:18px;box-shadow:var(--shadow);">
    <button class="modal-close" id="imgClose" style="position:absolute;top:8px;right:10px;z-index:2;background:rgba(255,255,255,.9);border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;">×</button>
    <img id="imgBig" class="img-big" alt="预览" />
  </div>
</div>

  <!-- 温馨提醒已改为右下角非阻塞小提示（toast），不再使用挡全屏弹窗 -->

<input type="file" id="avatarInput" accept="image/*" hidden />
<div class="toast" id="toast" hidden></div>

<script src="js/data.js?v=9"></script>
<script src="https://cdn.jsdelivr.net/npm/solarlunar@1.0.2/solarlunar.min.js"></script>
<script src="js/app.js?v=9"></script>
<script src="js/remind-fallback.js?v=9"></script>
</body>
</html>
